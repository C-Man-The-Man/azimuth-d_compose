services:
  azimuth:
    #
    # Both ARM64 and AMD64 releases load the same image tag.
    #
    # Normally this should remain unchanged.
    #
    image: azimuth-node:latest

    container_name: azimuth

    restart: unless-stopped

    #
    # Hardware access
    #
    # RTL-SDR Blog V3/V4
    #
    devices:
      - /dev/bus/usb:/dev/bus/usb

      #
      # Optional GPS receiver
      #
      # Required only if using a USB GPS such as a u-blox receiver.
      #
      - /dev/ttyACM0:/dev/ttyACM0

    #
    # Numeric host group ID for plugdev.
    #
    # On Raspberry Pi OS this is usually 46.
    #
    # Check with:
    #
    #   getent group plugdev
    #
    group_add:
      - "46"

    #
    # Keep the status endpoint local.
    #
    # Status:
    #
    # http://127.0.0.1:8420/status
    #
    ports:
      - "127.0.0.1:8420:8420"

    environment:

      #
      # Used ONLY during the very first startup.
      #
      # The entrypoint generates:
      #
      #   /var/lib/azimuth/config.toml
      #
      # Once that file exists, ALL AZIMUTH_* variables are ignored.
      #
      # TO REGENERATE THE CONFIGURATION:
      #
      #   docker compose down
      #   docker volume rm azimuth-data
      #   docker compose up -d
      #

      AZIMUTH_API_URL: "https://azimuth.day"

      #
      # Generate from:
      #
      # https://azimuth.day/dashboard/settings
      #
      AZIMUTH_API_KEY: "Insert_Your_API_key"

      #
      # This name appears in the Azimuth Dashboard, by Overview, scrolling down to Nodes.
      # In the My Nodes tab, the node gets a new name, similar to Helium naming, a 3 word fancy animal name.
      #
      AZIMUTH_NODE_LABEL: "Give_it_a_name"

      #
      # Real installation coordinates.
      #
      # Even with a GPS connected, it's recommended to configure these.
      # The current daemon validates config.toml and has not been observed
      # replacing these values automatically with GPS coordinates.
      #
      AZIMUTH_NODE_LAT: "0.0000"
      AZIMUTH_NODE_LON: "0.0000"

      #
      # Antenna altitude in meters ABOVE MEAN SEA LEVEL (MSL).
      #
      # Not antenna height above the ground.
      #
      AZIMUTH_NODE_ALT: "0"

      AZIMUTH_HARDWARE_TYPE: "tier1_rtlsdr"

      AZIMUTH_STATUS_BIND: "0.0.0.0:8420"

      AZIMUTH_HEARTBEAT_SECS: "15"

      AZIMUTH_SUBMIT_SECS: "30"

      #
      # RTL-SDR defaults
      #
      AZIMUTH_SDR_SAMPLE_RATE: "2048000"

      #
      # -1 = Automatic tuner gain
      #
      AZIMUTH_SDR_GAIN: "-1"
      #
      # Generated configuration location.
      #
      # Mount your own config.toml here to enable the
      # experimental multi-signal scanner.
      #
      AZIMUTH_CONFIG_PATH: "/var/lib/azimuth/config.toml"

    #
    # Persistent node identity.
    #
    # Stores:
    #
    #   config.toml
    #   node-identity.json
    #
    # Do NOT delete unless you intentionally want to
    # register a new node.
    #
    volumes:
      - azimuth-data:/var/lib/azimuth
      #
      # Enable the experimental scanner by uncommenting:
      #
      #- ./config.toml:/var/lib/azimuth/config.toml
      #

    #
    # Local health check
    #
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/status"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  azimuth-data:
    name: azimuth-data
