# =============================================================================
# Azimuth Tier 1 Node — Docker Compose (Community Edition)
#
# This Compose file intentionally follows the official Azimuth deployment.
# Only the comments have been expanded to provide additional explanations for
# Raspberry Pi users and Docker beginners.
#
# Official documentation:
# https://azimuth.day/docs/docker
#
# =============================================================================

services:
  azimuth-node:

    #
    # Official Azimuth Docker image.
    #
    # ARM64 version.
    #
    # If you are using an Intel/AMD computer, use docker-compose.amd64.yml instead.
    #
    # Old image tag
    # azimuth-node:latest-arm64
    # in case the new one stops working, replace the image name and
    # use the tarball method
    #
    image: ghcr.io/azimuth-official/azimuth-node:latest

    container_name: azimuth-node

    restart: unless-stopped

    # -------------------------------------------------------------------------
    # Hardware Access
    # -------------------------------------------------------------------------
    #
    # Pass the host USB bus into the container so the RTL-SDR can be detected.
    #
    # Remove this section if you intentionally want to run without hardware.
    #
    devices:
      - "/dev/bus/usb:/dev/bus/usb"

      #
      # Optional USB GPS receiver.
      #
      # Uncomment (delete the hashtag symbol #) and adjust the device path if using
      # a GPS receiver such as a u-blox USB receiver.
      #
      # Example: /dev/ttyACM0:/dev/ttyACM0
      #
      #- "/dev/ttyACM0:/dev/ttyACM0"

    # -------------------------------------------------------------------------
    # USB Permissions
    # -------------------------------------------------------------------------
    #
    # The container runs as the non-root user "azimuth".
    #
    # That user must belong to the same group that owns the USB device on the
    # host system.
    #
    # Raspberry Pi OS, Debian and Ubuntu usually use:
    #
    #     plugdev (gid 46)
    #
    # Verify yours with:
    #
    #     getent group plugdev
    #
    # or:
    #
    #     ls -n /dev/bus/usb/001/
    #
    group_add:
      - "46"

    # -------------------------------------------------------------------------
    # Configuration
    # -------------------------------------------------------------------------
    #
    # IMPORTANT
    #
    # These environment variables are ONLY used during the FIRST startup.
    #
    # On the first boot, the container generates:
    #
    #     /var/lib/azimuth/config.toml
    #
    # and stores it inside the persistent Docker volume.
    #
    # Future restarts reuse that configuration so your node keeps the same
    # identity.
    #
    # To regenerate the configuration from these variables:
    #
    #     docker compose down -v
    #     docker compose up -d
    #
    # WARNING:
    #
    # Removing the Docker volume also removes your node identity.
    #
    environment:

      # -----------------------------------------------------------------------
      # Backend API
      # -----------------------------------------------------------------------

      AZIMUTH_API_URL: "https://azimuth.day"

      #
      # REQUIRED
      #
      # Generate an API key from:
      #
      # https://azimuth.day/dashboard/settings
      #
      AZIMUTH_API_KEY: "Paste_Your_API_Key"

      # -----------------------------------------------------------------------
      # Node Identity
      # -----------------------------------------------------------------------

      #
      # Leave empty.
      #
      # The node automatically registers itself during the first startup and 
      # stores the assigned Node ID inside the Docker volume.
      #
      AZIMUTH_NODE_ID: ""

      #
      # Friendly node name shown in the Dashboard.
      #
      AZIMUTH_NODE_LABEL: "my-azimuth-node"

      #
      # Hardware type.
      #
      # Normally this should not be changed.
      #
      AZIMUTH_HARDWARE_TYPE: "tier1_rtlsdr"

      # -----------------------------------------------------------------------
      # Node Location
      # -----------------------------------------------------------------------

      #
      # Latitude and Longitude in decimal degrees.
      #
      AZIMUTH_NODE_LAT: "0.0000"

      AZIMUTH_NODE_LON: "0.0000"

      #
      # Antenna altitude in meters ABOVE MEAN SEA LEVEL (MSL).
      #
      # This is NOT the height of the antenna above the ground topology.
      #
      AZIMUTH_NODE_ALT: "0"

      # -----------------------------------------------------------------------
      # Daemon Behaviour
      # -----------------------------------------------------------------------

      #
      # Local status endpoint inside the container.
      #
      # Leave unchanged.
      #
      AZIMUTH_STATUS_BIND: "0.0.0.0:8420"

      AZIMUTH_HEARTBEAT_SECS: "15"

      AZIMUTH_SUBMIT_SECS: "30"

      # -----------------------------------------------------------------------
      # RTL-SDR
      # -----------------------------------------------------------------------

      #
      # Standard RTL-SDR sample rate.
      #
      AZIMUTH_SDR_SAMPLE_RATE: "2048000"

      #
      # Automatic tuner gain.
      #
      # -1 enables Automatic Gain Control (recommended).
      #
      AZIMUTH_SDR_GAIN: "-1"

      # -----------------------------------------------------------------------
      # Region
      # -----------------------------------------------------------------------

      #
      # ISO 3166-1 alpha-2 country code.
      #
      # Examples:
      #
      # ES  Spain
      # FR  France
      # DE  Germany
      # US  United States
      # GB  United Kingdom
      #
      # AUTO selects the default worldwide frequency plan.
      #
      # Full list:
      #
      # https://azimuth.day/docs/regions
      #
      AZIMUTH_REGION: "AUTO"

      # -----------------------------------------------------------------------
      # Advanced Configuration
      # -----------------------------------------------------------------------

      #
      # Path where the generated configuration is stored.
      #
      # Advanced users may replace this file with their own configuration after
      # the first startup.
      #
      AZIMUTH_CONFIG_PATH: "/var/lib/azimuth/config.toml"

    # -------------------------------------------------------------------------
    # Local Status Endpoint
    # -------------------------------------------------------------------------
    #
    # Accessible only from the local machine:
    #
    # http://127.0.0.1:8420/status
    #
    # Do NOT expose this publicly unless protected by an authenticating reverse
    # proxy.
    #
    ports:
      - "127.0.0.1:8420:8420"

    # -------------------------------------------------------------------------
    # Persistent Data
    # -------------------------------------------------------------------------
    #
    # Stores:
    #
    # • config.toml
    # • node-identity.json
    #
    # Do NOT remove unless you intentionally want to register a completely new
    # node.
    #
    volumes:
      - azimuth-data:/var/lib/azimuth

    # -------------------------------------------------------------------------
    # Health Check
    # -------------------------------------------------------------------------

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/status"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  azimuth-data:
    name: azimuth-data
