#########################################################
#
# Europe Generic Scanner Configuration
#
# Compatible with:
#   Azimuth v0.2.3
#
# This configuration is intended as a generic
# starting point for most European countries.
#
# Television:
#   DVB-T / DVB-T2
#
# LTE:
#   Not included.
#
# LTE allocations differ significantly across Europe
# and should be configured per-country once verified.
#
#########################################################

[scanning]

mode = "both"

interval_seconds = 30

weight_fm = 1
weight_lte = 3
weight_dtv = 2

retune_delay_ms = 100
capture_retries = 3
max_observations_per_cycle = 20

#########################################################
# FM
#########################################################

[scanning.fm]

frequencies = []

sweep_start = 87500000
sweep_end = 108000000
sweep_step = 200000

#########################################################
# LTE
#########################################################

[scanning.lte]

#
# No verified Europe-wide LTE frequencies yet.
#
frequencies = []

#########################################################
# DVB-T / DVB-T2
#########################################################

[scanning.dtv]

frequencies = []

sweep_start = 470000000
sweep_end = 608000000
sweep_step = 6000000
