##############################################################
#
# Azimuth Regional Scanner Profile
#
# Country:
#     United States / Canada
#
# Region:
#     North America
#
# Television Standard:
#     ATSC
#
# FM Broadcast Band:
#     87.5 MHz – 108 MHz
#
# Source Documentation:
#     Official Azimuth scanner example
#
# Repository:
#     https://github.com/C-Man-The-Man/azimuth-d_compose
#
# Maintainer:
#     C-Man-The-Man
#
# Description:
#     Scanner configuration optimized for North America.
#
# Installation:
#
#     mv usa-canada.toml config.toml
#
# Restart afterwards:
#
#     docker compose restart
#
##############################################################

[scanning]

mode = "both"

interval_seconds = 30

weight_fm = 1
weight_lte = 3
weight_dtv = 2

retune_delay_ms = 100
capture_retries = 3
max_observations_per_cycle = 20

##############################################################
# FM
##############################################################

[scanning.fm]

frequencies = []

sweep_start = 87500000
sweep_end   = 108000000
sweep_step  = 200000

##############################################################
# LTE
##############################################################

[scanning.lte]

frequencies = [
    631000000,
    637000000,
    737000000,
    881000000
]

##############################################################
# ATSC Television
##############################################################

[scanning.dtv]

frequencies = []

sweep_start = 470000000
sweep_end   = 608000000
sweep_step  = 6000000

##############################################################
#
# End of configuration
#
# Looking for updates?
#
# https://github.com/C-Man-The-Man/azimuth-d_compose
#
##############################################################
